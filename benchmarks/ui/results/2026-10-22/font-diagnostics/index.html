<!doctype html><meta charset="utf-8"><title>Actual font metrics diagnostic</title><style>body{margin:16px;background:#fff;color:#111;font-family:"Segoe UI",Arial,sans-serif;font-size:14px} .line{border-bottom:1px solid #ddd;padding:2px}canvas{border:1px solid #888}</style><h2>Native and Chrome font metrics</h2><div id="samples"></div><canvas id="canvas" width="900" height="360"></canvas><script>
const fonts=['normal 12px "Segoe UI"','normal 14px "Segoe UI"','normal 16px "Segoe UI"','normal 18px "Segoe UI"','bold 14px "Segoe UI"','normal 14px Arial','normal 14px sans-serif','normal 14px system-ui'];
const container=document.getElementById('samples');
for(const font of fonts){const line=document.createElement('div');line.className='line';line.style.font=font;line.textContent=font+' — Hg Record 12345';container.appendChild(line);}
const ctx=document.getElementById('canvas').getContext('2d');ctx.fillStyle='#111';fonts.forEach((font,index)=>{ctx.font=font;ctx.fillText(font+' Hg Record 12345',8,30+index*40);});
window.fontProbe=()=>({environment:{ua:navigator.userAgent,dpr:devicePixelRatio},lines:Array.from(container.children).map(line=>{const style=getComputedStyle(line);const rect=line.getBoundingClientRect();const range=document.createRange();range.selectNodeContents(line);const text=range.getBoundingClientRect();return{font:style.font,fontSize:style.fontSize,fontFamily:style.fontFamily,lineHeight:style.lineHeight,boxHeight:rect.height,textHeight:text.height,textTop:text.top};}),canvas:fonts.map(font=>{ctx.font=font;const m=ctx.measureText('Hg Record 12345');return{font,actualFont:ctx.font,width:m.width,actualAscent:m.actualBoundingBoxAscent,actualDescent:m.actualBoundingBoxDescent,fontAscent:m.fontBoundingBoxAscent,fontDescent:m.fontBoundingBoxDescent};})});
</script>

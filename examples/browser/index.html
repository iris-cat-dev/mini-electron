<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-electron macOS GUI Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #0c111b;
      color: #eef4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(75, 121, 255, .26), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(38, 211, 160, .18), transparent 38%),
        #0c111b;
    }
    main {
      width: min(860px, calc(100% - 56px));
      margin: 0 auto;
      padding: 58px 0 48px;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #8ba7ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .lead {
      max-width: 660px;
      margin: 24px 0 32px;
      color: #abb9d2;
      font-size: 18px;
      line-height: 1.65;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      padding: 9px 14px;
      border: 1px solid rgba(93, 235, 182, .32);
      border-radius: 999px;
      background: rgba(44, 166, 125, .12);
      color: #78edc0;
      font-size: 14px;
      font-weight: 650;
    }
    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #42e2a4;
      box-shadow: 0 0 16px #42e2a4;
      content: "";
    }
    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 14px;
    }
    .card {
      min-height: 150px;
      padding: 22px;
      border: 1px solid rgba(173, 194, 235, .16);
      border-radius: 18px;
      background: rgba(20, 29, 45, .78);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .18);
      backdrop-filter: blur(18px);
    }
    .card strong {
      display: block;
      margin-bottom: 12px;
      color: #91aaff;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .card span {
      display: block;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.25;
    }
    .card small {
      display: block;
      margin-top: 10px;
      color: #8f9db6;
      line-height: 1.45;
    }
    #engine-result {
      color: #73efbd;
      font-size: 54px;
      letter-spacing: -.05em;
    }
    button {
      margin-top: 22px;
      padding: 12px 18px;
      border: 0;
      border-radius: 11px;
      background: #6f8cff;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    #interaction-state {
      display: inline-block;
      margin-left: 14px;
      color: #93a2bc;
      font-size: 14px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      main { width: min(100% - 34px, 620px); padding-top: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">mini-electron / native macOS host</p>
    <h1>前端已在原生窗口中正常渲染</h1>
    <p class="lead">
      这个演示由 mini-electron 的 WebViewHost 创建 Blink Page/LocalFrame，网络响应进入 Blink HTML 解析器，
      页面脚本由仓库内 V8 执行，最终由 AppKit NSView 显示 Blink 软件光栅位图。
    </p>
    <div class="status" id="native-input-state">等待原生输入事件</div>

    <section class="grid" aria-label="运行状态">
      <article class="card">
        <strong>Engine probe</strong>
        <span id="engine-name">正在读取引擎信息</span>
        <small id="engine-platform">等待原生宿主注入</small>
      </article>
      <article class="card">
        <strong>V8 result</strong>
        <span id="engine-result">--</span>
        <small>由仓库内 V8 执行 JavaScript 得到</small>
      </article>
      <article class="card">
        <strong>Window</strong>
        <span>AppKit</span>
        <small>960 × 640，可调整大小</small>
      </article>
    </section>

    <button id="interaction" type="button">运行前端交互</button>
    <span id="interaction-state">尚未点击</span>
  </main>

  <script>
    const engine = window.__MINI_ELECTRON_ENGINE__ || {
      engine: "mini-electron / Blink 132",
      platform: "macOS",
      arch: "arm64",
      runLoop: "CFRunLoop",
      result: 6 * 7
    };
    document.getElementById("engine-name").textContent = engine.engine;
    document.getElementById("engine-platform").textContent =
      `${engine.platform} / ${engine.arch} / ${engine.runLoop}`;
    document.getElementById("engine-result").textContent = engine.result;

    let interactions = 0;
    document.getElementById("interaction").addEventListener("click", () => {
      interactions += 1;
      document.getElementById("interaction-state").textContent =
        `前端事件已执行 ${interactions} 次`;
    });
    const inputState = document.getElementById("native-input-state");
    document.addEventListener("pointerdown", () => {
      inputState.textContent = "Blink 已收到原生鼠标事件";
    });
    document.addEventListener("keydown", () => {
      inputState.textContent = "Blink 已收到原生键盘事件";
    });
    document.documentElement.dataset.ready = "true";
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniBlink Electron API Demo</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #183153, #090f1d 62%); color: #eef6ff; }
    main { width: min(680px, calc(100vw - 48px)); padding: 42px; border: 1px solid #375a7f; border-radius: 20px; background: rgba(9, 21, 38, .88); box-shadow: 0 24px 80px #0008; }
    .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #2dd4bf22; color: #5eead4; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 22px 0 12px; font-size: 42px; line-height: 1.05; }
    p { color: #b9c8da; font-size: 18px; line-height: 1.6; }
    code { color: #93c5fd; }
    ul { padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; list-style: none; }
    li { padding: 13px 15px; border-radius: 10px; background: #ffffff0a; border: 1px solid #ffffff12; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Electron-compatible main process</span>
    <h1>MiniBlink is rendering this BrowserWindow.</h1>
    <p>The native macOS host was created by <code>require('electron')</code>, <code>app.whenReady()</code>, and <code>new BrowserWindow()</code>.</p>
    <ul>
      <li>AppKit window</li><li>Blink renderer</li><li>V8 main script</li><li>Electron loadFile API</li>
    </ul>
  </main>
</body>
</html>
